# Host-based authentication.
# The VM lives inside the private subnet — anything reaching us has already
# passed the VPC firewall. We still require a scram-sha-256 password.
#
# Format: TYPE  DATABASE  USER  ADDRESS  METHOD

# Local unix socket for maintenance jobs running on the same VM.
local   all             all                                     peer

# Application traffic from the Serverless VPC Access subnet.
# Replace 10.8.0.0/28 with the actual connector subnet CIDR.
host    cred            cred            10.8.0.0/28             scram-sha-256

# Postgres exporter running in the same docker network.
host    cred            cred            172.16.0.0/12           scram-sha-256

# Deny everything else.
host    all             all             0.0.0.0/0               reject
