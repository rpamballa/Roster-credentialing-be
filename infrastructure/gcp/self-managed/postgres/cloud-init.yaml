#cloud-config
# Bootstraps a Postgres VM on Container-Optimized OS. Assumes:
#   - a data disk attached at /dev/sdb
#   - the VM's service account has Secret Manager accessor + GCS objectAdmin
#     on the backup bucket
#   - the cred-postgres compose files live at /home/cred/postgres/ (rsynced
#     down from the repo before `gcloud instances create`)

write_files:
  - path: /etc/systemd/system/cred-postgres.service
    permissions: 0644
    content: |
      [Unit]
      Description=cred-postgres compose stack
      Wants=docker.service
      After=docker.service network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=true
      WorkingDirectory=/home/cred/postgres
      EnvironmentFile=/home/cred/postgres/.env
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      [Install]
      WantedBy=multi-user.target

  - path: /etc/cron.d/cred-postgres-backup
    permissions: 0644
    content: |
      # Nightly at 03:12 UTC. WAL is archived continuously by Postgres.
      12 3 * * * root cd /home/cred/postgres && /home/cred/postgres/backup.sh >> /var/log/cred-postgres-backup.log 2>&1

  - path: /home/cred/postgres/fetch-secrets.sh
    permissions: 0755
    content: |
      #!/bin/sh
      # Pulls POSTGRES_PASSWORD from Secret Manager and writes .env.
      set -eu
      P=$(gcloud secrets versions access latest --secret=cred-postgres-password)
      cat > /home/cred/postgres/.env <<EOF
      POSTGRES_USER=cred
      POSTGRES_PASSWORD=$P
      POSTGRES_DB=cred
      WAL_ARCHIVE_BUCKET=${WAL_ARCHIVE_BUCKET}
      BACKUP_BUCKET=${BACKUP_BUCKET}
      EOF
      chmod 600 /home/cred/postgres/.env

runcmd:
  # 1. Format + mount the data disk if fresh.
  - [ bash, -lc, "if ! blkid /dev/sdb; then mkfs.ext4 -F /dev/sdb; fi" ]
  - [ mkdir, -p, /var/lib/postgresql/data ]
  - [ bash, -lc, "grep -q /dev/sdb /etc/fstab || echo '/dev/sdb /var/lib/postgresql/data ext4 defaults,noatime 0 2' >> /etc/fstab" ]
  - [ mount, -a ]
  # 2. Hydrate .env from Secret Manager.
  - [ /home/cred/postgres/fetch-secrets.sh ]
  # 3. Start the compose stack via systemd.
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, cred-postgres.service ]
