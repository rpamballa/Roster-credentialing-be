name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: quay.io/tembo/pg16-pgmq:latest
        env:
          POSTGRES_USER: cred
          POSTGRES_PASSWORD: cred
          POSTGRES_DB: cred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cred -d cred_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cred:cred@localhost:5432/cred_test
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-session-secret-1234567890
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @cred/db migrate
      - run: pnpm test
