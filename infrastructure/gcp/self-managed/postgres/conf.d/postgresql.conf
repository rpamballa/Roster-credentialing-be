# Postgres 16 config tuned for n2d-standard-2 (2 vCPU / 8 GB RAM).
# See ADR-0001. Change requires a docker restart + a runbook entry.

# ─── connections ──────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 200

# ─── memory ───────────────────────────────────────────────────────────
shared_buffers = 2GB                # ~25% of RAM
effective_cache_size = 6GB          # ~75% of RAM
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ─── WAL + archival ───────────────────────────────────────────────────
wal_level = replica                 # required for pg_basebackup + streaming
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = '/usr/local/bin/archive-wal.sh %p %f'
archive_timeout = 300               # force an archive every 5 min

# ─── planner + parallelism ────────────────────────────────────────────
random_page_cost = 1.1              # SSD
effective_io_concurrency = 200
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# ─── logging ──────────────────────────────────────────────────────────
logging_collector = off             # container captures stdout
log_min_duration_statement = 500ms  # anything slow enough to notice
log_checkpoints = on
log_connections = off               # too noisy — enable when debugging
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ─── autovacuum ───────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ─── security ─────────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = off                           # terminated at the app; VPC is private
