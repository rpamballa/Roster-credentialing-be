# Redis 7 config for the credentialing platform.
# Sessions + rate-limit counters. AOF is the primary durability mode.

# ─── network ──────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── memory ───────────────────────────────────────────────────────────
maxmemory 1500mb
# noeviction for sessions — a full Redis returns errors rather than
# evicting a live session. Bump maxmemory if this fires.
maxmemory-policy noeviction

# ─── RDB (durable snapshots) ──────────────────────────────────────────
# Snapshot on: 15m if ≥1 change, 5m if ≥100, 60s if ≥10k.
save 900 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ─── AOF (append-only log) ────────────────────────────────────────────
# 1s fsync — trade at most 1 second of writes on crash for full throughput.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ─── keyspace notifications ───────────────────────────────────────────
# Emit expiration events so the rate-limit middleware can log evictions.
notify-keyspace-events Ex

# ─── slow log ─────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── security ─────────────────────────────────────────────────────────
# `requirepass` is set on the command line so it doesn't ship in this file.
# Rename dangerous commands so a stolen session token can't wipe the DB.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "SYS_CONFIG_5f9b"
