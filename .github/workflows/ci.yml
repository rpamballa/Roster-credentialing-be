name: ci

# Fires on every PR and on push to main. Both events run the same
# jobs so branch-protection can gate merges on `quality`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cred
          POSTGRES_PASSWORD: cred
          POSTGRES_DB: cred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cred -d cred_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cred:cred@localhost:5432/cred_test
      REDIS_URL: redis://localhost:6379/1
      SESSION_SECRET: ci-session-secret-1234567890
      NODE_ENV: test
      API_PUBLIC_URL: http://localhost:3001
      WEB_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Biome (lint + format check)
        run: pnpm exec biome check
      - name: Vitest — integration tests hit real Postgres + Redis via services
        run: pnpm --filter @cred/api test
