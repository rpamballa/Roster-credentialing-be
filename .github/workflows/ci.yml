name: ci

# Fires on every PR and on push to main. Both events run the exact
# same job so branch-protection can gate merges on the `quality` check.
#
# Kept deliberately minimal — typecheck + biome only — because the
# repo has no runnable test suite or migration harness yet. Broken
# `pnpm test` and `pnpm --filter @cred/db migrate` steps in the
# previous elaborate CI are why the workflow was disabled manually
# in the first place; a red gate that no one trusts is worse than no
# gate. Grow this list as those pieces are wired up: integration
# tests behind a Postgres service, Anthropic client unit tests,
# migration idempotency check.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Biome (lint + format check)
        run: pnpm exec biome check
